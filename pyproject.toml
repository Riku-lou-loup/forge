[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-maintenance"
version = "0.1.0"
description = "Equipment anomaly investigation using sensor measurements and technical documents."
readme = "README.md"
authors = [{ name = "Dang Duong Dang Khoa" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "ATTRIBUTION.md"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "plotly>=6,<7",
    "streamlit>=1.40,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "pydantic-settings>=2,<3",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "ipykernel>=6,<8",
    "matplotlib>=3.10,<4",
    "nbformat>=5.10,<6",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
